services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      # Listen on all interfaces: the phase 7 lab VMs reach Ollama on the WSL2
      # IP, not on localhost.
      - OLLAMA_HOST=0.0.0.0
      # Keep the model resident between orchestrator cycles (one every 20 s).
      # Without this, each query may reload several GB into VRAM.
      - OLLAMA_KEEP_ALIVE=30m
      # 12 GB of VRAM: one model loaded at a time. Important during the model
      # comparison so they do not compete for memory.
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
    name: ollama_data
