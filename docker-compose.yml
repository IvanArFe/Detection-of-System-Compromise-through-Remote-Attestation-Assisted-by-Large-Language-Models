services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      # Escuchar en todas las interfaces: las VMs del laboratorio (fase 7) alcanzan
      # Ollama en la IP de WSL2, no en localhost.
      - OLLAMA_HOST=0.0.0.0
      # Mantener el modelo residente entre ciclos del orquestador (uno cada 20 s).
      # Sin esto, cada consulta puede recargar varios GB en VRAM.
      - OLLAMA_KEEP_ALIVE=30m
      # 12 GB de VRAM: un solo modelo cargado a la vez, importante durante la
      # comparativa de modelos para que no compitan por memoria.
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
    name: ollama_data
